<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VOS</title>
<style>
:root{--mica:rgba(243,243,243,.86);--tx:#1a1a1a;--ac:#0067c0;--bd:rgba(0,0,0,.12);--hov:rgba(0,0,0,.07);--mut:#666}
@media(prefers-color-scheme:dark){:root{--mica:rgba(32,32,32,.88);--tx:#f3f3f3;--ac:#4cc2ff;--bd:rgba(255,255,255,.14);--hov:rgba(255,255,255,.09);--mut:#aaa}}
*{box-sizing:border-box;margin:0;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font:14px "Segoe UI Variable","Segoe UI",system-ui,sans-serif;color:var(--tx);background:#10243f}
#desk{position:fixed;inset:0 0 calc(48px + env(safe-area-inset-bottom,0px)) 0;padding-top:env(safe-area-inset-top,0px);background:radial-gradient(ellipse at 25% 15%,#4a9be8,transparent 55%),radial-gradient(ellipse at 80% 90%,#7b4fd6,transparent 50%),#10243f;overflow:hidden}
#ic{display:flex;flex-direction:column;flex-wrap:wrap;height:100%;align-content:flex-start;padding:8px}
.di{width:80px;padding:8px 4px;text-align:center;color:#fff;font-size:12px;border-radius:6px;text-shadow:0 1px 3px #000}
.di:hover{background:rgba(255,255,255,.15)}.di i{display:block;font-style:normal;font-size:34px}
.win{position:absolute;display:flex;flex-direction:column;background:var(--mica);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--bd);border-radius:10px;box-shadow:0 12px 48px rgba(0,0,0,.45);overflow:hidden;min-width:260px}
.win.max{inset:0!important;width:auto!important;height:auto!important;border-radius:0}
.tb{display:flex;align-items:center;height:36px;padding-left:12px;touch-action:none}
.tb b{flex:1;font-weight:400;font-size:12px;overflow:hidden;white-space:nowrap}
.tb button{width:44px;height:36px;border:0;background:none;color:inherit;font-size:13px}
.tb button:hover{background:var(--hov)}.tb button.x:hover{background:#c42b1c;color:#fff}
.bd{flex:1;overflow:auto;padding:12px;user-select:text;min-height:0}
#tk{position:fixed;left:0;right:0;bottom:0;height:calc(48px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:var(--mica);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--bd);z-index:9999}
#mid{display:flex;gap:4px}#tr{justify-self:end;display:flex;gap:10px;align-items:center;padding:0 12px;font-size:12px;text-align:right}
.tbtn{width:42px;height:40px;border:0;border-radius:6px;background:none;font-size:22px;position:relative}
.tbtn:hover{background:var(--hov)}.tbtn.on:after{content:"";position:absolute;bottom:2px;left:50%;width:12px;height:3px;margin-left:-6px;border-radius:2px;background:var(--ac)}
#sm{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(58px + env(safe-area-inset-bottom,0px));width:min(420px,94vw);background:var(--mica);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--bd);border-radius:12px;padding:16px;display:none;z-index:9998;box-shadow:0 12px 48px rgba(0,0,0,.4)}
#sm h4{font-weight:600;margin-bottom:10px}#sg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#sg button{border:0;background:none;color:inherit;padding:12px 4px;border-radius:8px;font-size:12px}#sg button:hover{background:var(--hov)}#sg i{display:block;font-style:normal;font-size:30px}
.btn,.in{font:inherit;color:inherit;background:var(--hov);border:1px solid var(--bd);border-radius:6px;padding:7px 12px}
.btn:hover{background:var(--bd)}.in{width:100%;user-select:text}
.row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:6px}.row:hover{background:var(--hov)}.row span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row small{color:var(--mut)}
.mut{color:var(--mut);margin-top:6px}h3{font-weight:600;margin:0 0 8px}
.sw{position:relative;display:inline-block;width:44px;height:22px;vertical-align:middle;margin-right:8px}.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#888;border-radius:22px;transition:.2s}.sw span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--ac)}.sw input:checked+span:before{transform:translateX(22px)}
#toast{position:fixed;right:12px;bottom:calc(60px + env(safe-area-inset-bottom,0px));background:var(--mica);border:1px solid var(--bd);border-radius:8px;padding:10px 14px;display:none;z-index:10000}
iframe{width:100%;flex:1;border:0;background:#fff;border-radius:6px}
</style></head><body>
<div id="desk"><div id="ic"></div></div>
<div id="sm"><h4 id="sh"></h4><div id="sg"></div></div>
<div id="tk"><div></div><div id="mid"></div><div id="tr"><span id="sd"></span><span id="ck"></span></div></div>
<div id="toast"></div>
<script>
const $=(s,e=document)=>e.querySelector(s);
const LANGS={en:'English',tr:'Türkçe',az:'Azərbaycanca',ru:'Русский',de:'Deutsch',fr:'Français',es:'Español',it:'Italiano',pt:'Português',nl:'Nederlands',pl:'Polski',uk:'Українська',ar:'العربية',fa:'فارسی',zh:'中文',ja:'日本語',ko:'한국어',hi:'हिन्दी',id:'Indonesia',vi:'Tiếng Việt',th:'ไทย',sv:'Svenska',no:'Norsk',da:'Dansk',fi:'Suomi',cs:'Čeština',el:'Ελληνικά',he:'עברית',hu:'Magyar',ro:'Română',bg:'Български',sr:'Српски',ka:'ქართული',kk:'Қазақша',uz:"O'zbekcha"};
const K='start files settings browser upload del language defender on off empty scanned protected unprotected go apps url'.split(' ');
const tr=(s)=>Object.fromEntries(K.map((k,i)=>[k,s.split('|')[i]]));
// Add more languages by adding a line here (same order as K). Missing keys fall back to English.
const T={
en:tr('Start|File Explorer|Settings|Browser|Upload|Delete|Language|Windows Defender|On|Off|No files yet|Scanned, clean|Your device is protected.|Real-time protection is off.|Go|Apps|Enter address'),
tr:tr('Başlat|Dosya Gezgini|Ayarlar|Tarayıcı|Yükle|Sil|Dil|Windows Defender|Açık|Kapalı|Henüz dosya yok|Tarandı, temiz|Cihazınız korunuyor.|Gerçek zamanlı koruma kapalı.|Git|Uygulamalar|Adres girin'),
az:tr('Başlat|Fayl Meneceri|Ayarlar|Brauzer|Yüklə|Sil|Dil|Windows Defender|Açıq|Bağlı|Hələ fayl yoxdur|Skan edildi, təmiz|Cihazınız qorunur.|Real vaxt qoruması bağlıdır.|Get|Tətbiqlər|Ünvan daxil edin'),
ru:tr('Пуск|Проводник|Параметры|Браузер|Загрузить|Удалить|Язык|Защитник Windows|Вкл|Выкл|Файлов пока нет|Проверено, угроз нет|Устройство защищено.|Защита в реальном времени отключена.|Перейти|Приложения|Введите адрес'),
de:tr('Start|Datei-Explorer|Einstellungen|Browser|Hochladen|Löschen|Sprache|Windows Defender|Ein|Aus|Noch keine Dateien|Geprüft, sauber|Ihr Gerät ist geschützt.|Echtzeitschutz ist aus.|Los|Apps|Adresse eingeben'),
fr:tr('Démarrer|Explorateur|Paramètres|Navigateur|Téléverser|Supprimer|Langue|Windows Defender|Activé|Désactivé|Aucun fichier|Analysé, sain|Votre appareil est protégé.|La protection en temps réel est désactivée.|Aller|Applications|Saisir une adresse'),
es:tr('Inicio|Explorador|Configuración|Navegador|Subir|Eliminar|Idioma|Windows Defender|Activado|Desactivado|Aún no hay archivos|Analizado, limpio|Tu dispositivo está protegido.|La protección en tiempo real está desactivada.|Ir|Aplicaciones|Escribe una dirección')
};
let S={lang:'en',def:true};
try{Object.assign(S,JSON.parse(localStorage.vos||'{}'))}catch(e){}
const save=()=>{try{localStorage.vos=JSON.stringify(S)}catch(e){}};
const t=k=>(T[S.lang]&&T[S.lang][k])||T.en[k];
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2500)}

/* ---------- storage (IndexedDB) ---------- */
const db=new Promise((res,rej)=>{try{const r=indexedDB.open('vos',1);r.onupgradeneeded=()=>r.result.createObjectStore('f',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
const tx=async(m,fn)=>{const d=await db;return new Promise((res,rej)=>{const r=fn(d.transaction('f',m).objectStore('f'));r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})};
const fmt=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';

/* ---------- apps ---------- */
async function filesR(b){
  b.innerHTML=`<div style="margin-bottom:10px"><button class="btn" id="up">⬆ ${t('upload')}</button><input type="file" id="fi" multiple hidden></div><div id="fl"></div>`;
  const fi=$('#fi',b);$('#up',b).onclick=()=>fi.click();
  fi.onchange=async()=>{for(const f of fi.files){try{await tx('readwrite',s=>s.add({name:f.name,size:f.size,type:f.type,blob:f}));if(S.def)toast('🛡 '+f.name+': '+t('scanned'))}catch(e){toast('Error: '+f.name)}}fi.value='';filesR(b)};
  let list=[];try{list=await tx('readonly',s=>s.getAll())}catch(e){}
  $('#fl',b).innerHTML=list.length?list.map(f=>`<div class="row" data-id="${f.id}"><span>${f.type.startsWith('image')?'🖼':'📄'} ${esc(f.name)}</span><small>${fmt(f.size)}</small><button class="btn" data-d="${f.id}">🗑 ${t('del')}</button></div>`).join(''):`<p class="mut">${t('empty')}</p>`;
  b.querySelectorAll('[data-d]').forEach(x=>x.onclick=async e=>{e.stopPropagation();await tx('readwrite',s=>s.delete(+x.dataset.d));filesR(b)});
  b.querySelectorAll('.row').forEach(r=>r.onclick=()=>{const f=list.find(i=>i.id==r.dataset.id);const u=URL.createObjectURL(f.blob);const a=document.createElement('a');a.href=u;a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)});
}
function setR(b){
  const lg=Object.entries(LANGS).map(([k,v])=>`<option value="${k}"${k==S.lang?' selected':''}>${v}</option>`).join('');
  b.innerHTML=`<h3>🌐 ${t('language')}</h3><select class="in" id="lg">${lg}</select>
  <h3 style="margin-top:22px">🛡 ${t('defender')}</h3><label class="sw"><input type="checkbox" id="df"${S.def?' checked':''}><span></span></label><b>${S.def?t('on'):t('off')}</b><p class="mut">${S.def?t('protected'):t('unprotected')}</p>`;
  $('#lg',b).onchange=e=>{S.lang=e.target.value;save();applyLang()};
  $('#df',b).onchange=e=>{S.def=e.target.checked;save();setR(b);tray()};
}
let bUrl='';
function brR(b){
  b.style.cssText='display:flex;flex-direction:column;gap:8px';
  b.innerHTML=`<div style="display:flex;gap:6px"><input class="in" id="ad" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://" value="${esc(bUrl)}"><button class="btn" id="go">${t('go')}</button></div><iframe id="fr"></iframe>`;
  const go=()=>{let u=$('#ad',b).value.trim();if(!u)return;if(!/^https?:\/\//i.test(u))u='https://'+u;bUrl=u;const P=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Browser;if(P){P.open({url:u});return}$('#fr',b).src=u};
  $('#go',b).onclick=go;$('#ad',b).onkeydown=e=>{if(e.key=='Enter')go()};
}
const APPS={
  browser:{icon:'🌐',key:'browser',render:brR,live:false},
  files:{icon:'📁',key:'files',render:filesR,live:true},
  settings:{icon:'⚙️',key:'settings',render:setR,live:true}
};

/* ---------- window manager ---------- */
let z=10;const wins={};
function open(id){
  $('#sm').style.display='none';
  if(wins[id]){wins[id].el.style.display='flex';focus(id);return}
  const a=APPS[id],el=document.createElement('div');el.className='win';
  const n=Object.keys(wins).length,small=innerWidth<700;
  if(small)el.classList.add('max');else el.style.cssText=`left:${70+n*32}px;top:${30+n*32}px;width:min(680px,80vw);height:min(440px,70vh)`;
  el.innerHTML='<div class="tb"><b></b><button data-a="min">–</button><button data-a="max">▢</button><button data-a="x" class="x">✕</button></div><div class="bd"></div>';
  $('#desk').appendChild(el);
  const w=wins[id]={id,el,ti:$('b',el),bd:$('.bd',el)};
  w.ti.textContent=a.icon+' '+t(a.key);a.render(w.bd);
  const tb=$('.tb',el);
  tb.onpointerdown=e=>{focus(id);if(e.target.tagName=='BUTTON'||el.classList.contains('max'))return;
    const r=el.getBoundingClientRect(),p=$('#desk').getBoundingClientRect(),dx=e.clientX-r.left,dy=e.clientY-r.top;tb.setPointerCapture(e.pointerId);
    tb.onpointermove=v=>{el.style.left=Math.max(0,v.clientX-dx-p.left)+'px';el.style.top=Math.max(0,v.clientY-dy-p.top)+'px'};tb.onpointerup=()=>tb.onpointermove=null};
  el.onpointerdown=()=>focus(id);
  tb.onclick=e=>{const k=e.target.dataset.a;if(k=='x'){el.remove();delete wins[id];task()}else if(k=='min'){el.style.display='none';task()}else if(k=='max')el.classList.toggle('max')};
  focus(id);
}
function focus(id){wins[id].el.style.zIndex=++z;wins[id].f=z;task()}
function task(){const top=Object.values(wins).filter(w=>w.el.style.display!='none').sort((a,b)=>b.f-a.f)[0];
  $('#mid').innerHTML=`<button class="tbtn" id="st">🪟</button>`+Object.keys(APPS).map(id=>`<button class="tbtn${wins[id]?' on':''}" data-id="${id}">${APPS[id].icon}</button>`).join('');
  $('#st').onclick=e=>{e.stopPropagation();const m=$('#sm');m.style.display=m.style.display=='block'?'none':'block'};
  document.querySelectorAll('#mid [data-id]').forEach(b=>b.onclick=()=>{const w=wins[b.dataset.id];if(w&&w===top){w.el.style.display='none';task()}else open(b.dataset.id)})}
function tray(){$('#sd').textContent=S.def?'🛡':'🛡︎⚠'}
function clock(){$('#ck').innerHTML=new Date().toLocaleTimeString(S.lang,{hour:'2-digit',minute:'2-digit'})+'<br>'+new Date().toLocaleDateString(S.lang)}
function applyLang(){
  document.documentElement.lang=S.lang;document.documentElement.dir=['ar','fa','he'].includes(S.lang)?'rtl':'ltr';
  Object.values(wins).forEach(w=>{const a=APPS[w.id];w.ti.textContent=a.icon+' '+t(a.key);if(a.live)a.render(w.bd)});
  $('#sh').textContent=t('apps');
  $('#sg').innerHTML=Object.keys(APPS).map(id=>`<button data-id="${id}"><i>${APPS[id].icon}</i>${t(APPS[id].key)}</button>`).join('');
  $('#sg').querySelectorAll('button').forEach(b=>b.onclick=()=>open(b.dataset.id));
  $('#ic').innerHTML=Object.keys(APPS).map(id=>`<div class="di" data-id="${id}"><i>${APPS[id].icon}</i>${t(APPS[id].key)}</div>`).join('');
  $('#ic').querySelectorAll('.di').forEach(d=>d.onclick=()=>open(d.dataset.id));
  clock();task();tray();
}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#sm,#st'))$('#sm').style.display='none'});
applyLang();setInterval(clock,10000);
</script></body></html>
