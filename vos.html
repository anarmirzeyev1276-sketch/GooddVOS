<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VOS</title>
<style>
:root{--mica:rgba(247,247,250,.8);--tx:#1b1b1f;--ac:#0a64d6;--bd:rgba(0,0,0,.09);--hov:rgba(0,0,0,.06);--mut:#6b6b73;--card:rgba(255,255,255,.7)}
@media(prefers-color-scheme:dark){:root{--mica:rgba(32,33,41,.8);--tx:#f4f4f7;--ac:#60cdff;--bd:rgba(255,255,255,.1);--hov:rgba(255,255,255,.09);--mut:#a8a8b3;--card:rgba(255,255,255,.06)}}
*{box-sizing:border-box;margin:0;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font:14px "Segoe UI Variable","Segoe UI",system-ui,sans-serif;color:var(--tx);background:#0b1d3a}
svg{display:block}
#desk{position:fixed;inset:0 0 calc(52px + env(safe-area-inset-bottom,0px)) 0;padding-top:env(safe-area-inset-top,0px);overflow:hidden;background:radial-gradient(55% 75% at 18% 22%,#5ab0ff,transparent 65%),radial-gradient(50% 70% at 82% 28%,#a06bff,transparent 62%),radial-gradient(70% 60% at 58% 105%,#12d3c4,transparent 62%),linear-gradient(160deg,#0b1d3a,#1c1050)}
#ic{display:flex;flex-direction:column;flex-wrap:wrap;height:100%;align-content:flex-start;padding:10px}
.di{width:84px;padding:8px 4px;text-align:center;color:#fff;font-size:12px;border-radius:8px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.di:hover,.di:active{background:rgba(255,255,255,.16)}.di i{display:block;width:46px;height:46px;margin:0 auto 4px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
.win{position:absolute;display:flex;flex-direction:column;background:var(--mica);backdrop-filter:blur(28px) saturate(1.4);-webkit-backdrop-filter:blur(28px) saturate(1.4);border:1px solid var(--bd);border-radius:12px;box-shadow:0 24px 64px rgba(0,0,0,.4);overflow:hidden;min-width:260px}
.win.max{inset:0!important;width:auto!important;height:auto!important;border-radius:0}
.tb{display:flex;align-items:center;height:40px;padding-left:14px;touch-action:none}
.tb b{flex:1;font-weight:400;font-size:12.5px;display:flex;align-items:center;gap:8px;overflow:hidden;white-space:nowrap}
.tb b svg{width:16px;height:16px;flex:none}
.tb button{width:46px;height:40px;border:0;background:none;color:inherit;font-size:13px}
.tb button:hover{background:var(--hov)}.tb button.x:hover{background:#c42b1c;color:#fff}
.bd{flex:1;overflow:auto;padding:14px;user-select:text;min-height:0}
#tk{position:fixed;left:0;right:0;bottom:0;height:calc(52px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:var(--mica);backdrop-filter:blur(30px) saturate(1.4);-webkit-backdrop-filter:blur(30px) saturate(1.4);border-top:1px solid var(--bd);z-index:9999}
#mid{display:flex;gap:6px}#tr{justify-self:end;display:flex;gap:10px;align-items:center;padding:0 14px;font-size:12px;text-align:right;line-height:1.3}
.tbtn{width:44px;height:44px;border:0;border-radius:8px;background:none;position:relative;display:grid;place-items:center}
.tbtn svg{width:26px;height:26px}.tbtn:hover,.tbtn:active{background:var(--hov)}
.tbtn.on:after{content:"";position:absolute;bottom:2px;left:50%;width:16px;height:3px;margin-left:-8px;border-radius:2px;background:var(--ac)}
#sm{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));width:min(440px,94vw);background:var(--mica);backdrop-filter:blur(34px) saturate(1.5);-webkit-backdrop-filter:blur(34px) saturate(1.5);border:1px solid var(--bd);border-radius:16px;padding:20px;display:none;z-index:9998;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#sm h4{font-weight:600;font-size:13px;margin-bottom:12px}#sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#sg button{border:1px solid var(--bd);background:var(--card);color:inherit;padding:14px 4px;border-radius:10px;font-size:12px}#sg button:hover{background:var(--hov)}#sg i{display:block;width:38px;height:38px;margin:0 auto 8px}
.btn,.in{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 14px}
.btn:hover{background:var(--hov)}.in{width:100%;user-select:text}
.row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px}.row:hover{background:var(--hov)}.row span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row small{color:var(--mut)}
#fl .row{background:var(--card);border:1px solid var(--bd);margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.mut{color:var(--mut);margin-top:6px}h3{font-weight:600;margin:0 0 10px}
.sw{position:relative;display:inline-block;width:44px;height:22px;vertical-align:middle;margin-right:8px}.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#888;border-radius:22px;transition:.2s}.sw span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--ac)}.sw input:checked+span:before{transform:translateX(22px)}
#toast{position:fixed;right:12px;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--mica);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;display:none;z-index:10000}
iframe{width:100%;flex:1;border:0;background:#fff}
.tab.act{background:var(--ac);color:#fff;border-color:transparent}
.msg{padding:9px 12px;border-radius:12px;max-width:90%;white-space:pre-wrap;user-select:text;word-break:break-word}
.msg.user{align-self:flex-end;background:#0a64d6;color:#fff}.msg.assistant{align-self:flex-start;background:var(--card);border:1px solid var(--bd)}
.lk{color:var(--ac);text-decoration:underline}
</style></head><body>
<div id="desk"><div id="ic"></div></div>
<div id="sm"><h4 id="sh"></h4><div id="sg"></div></div>
<div id="tk"><div></div><div id="mid"></div><div id="tr"><span id="sd"></span><span id="ck"></span></div></div>
<div id="toast"></div>
<script>
const $=(s,e=document)=>e.querySelector(s);
const LANGS={en:'English',tr:'Türkçe',az:'Azərbaycanca',ru:'Русский',de:'Deutsch',fr:'Français',es:'Español',it:'Italiano',pt:'Português',nl:'Nederlands',pl:'Polski',uk:'Українська',ar:'العربية',fa:'فارسی',zh:'中文',ja:'日本語',ko:'한국어',hi:'हिन्दी',id:'Indonesia',vi:'Tiếng Việt',th:'ไทย',sv:'Svenska',no:'Norsk',da:'Dansk',fi:'Suomi',cs:'Čeština',el:'Ελληνικά',he:'עברית',hu:'Magyar',ro:'Română',bg:'Български',sr:'Српски',ka:'ქართული',kk:'Қазақша',uz:"O'zbekcha"};
const K='start files settings browser upload del language defender on off empty scanned protected unprotected go apps url'.split(' ');
const tr=(s)=>Object.fromEntries(K.map((k,i)=>[k,s.split('|')[i]]));
// Add more languages by adding a line here (same order as K). Missing keys fall back to English.
const T={
en:tr('Start|File Explorer|Settings|Browser|Upload|Delete|Language|Windows Defender|On|Off|No files yet|Scanned, clean|Your device is protected.|Real-time protection is off.|Go|Apps|Enter address'),
tr:tr('Başlat|Dosya Gezgini|Ayarlar|Tarayıcı|Yükle|Sil|Dil|Windows Defender|Açık|Kapalı|Henüz dosya yok|Tarandı, temiz|Cihazınız korunuyor.|Gerçek zamanlı koruma kapalı.|Git|Uygulamalar|Adres girin'),
az:tr('Başlat|Fayl Meneceri|Ayarlar|Brauzer|Yüklə|Sil|Dil|Windows Defender|Açıq|Bağlı|Hələ fayl yoxdur|Skan edildi, təmiz|Cihazınız qorunur.|Real vaxt qoruması bağlıdır.|Get|Tətbiqlər|Ünvan daxil edin'),
ru:tr('Пуск|Проводник|Параметры|Браузер|Загрузить|Удалить|Язык|Защитник Windows|Вкл|Выкл|Файлов пока нет|Проверено, угроз нет|Устройство защищено.|Защита в реальном времени отключена.|Перейти|Приложения|Введите адрес'),
de:tr('Start|Datei-Explorer|Einstellungen|Browser|Hochladen|Löschen|Sprache|Windows Defender|Ein|Aus|Noch keine Dateien|Geprüft, sauber|Ihr Gerät ist geschützt.|Echtzeitschutz ist aus.|Los|Apps|Adresse eingeben'),
fr:tr('Démarrer|Explorateur|Paramètres|Navigateur|Téléverser|Supprimer|Langue|Windows Defender|Activé|Désactivé|Aucun fichier|Analysé, sain|Votre appareil est protégé.|La protection en temps réel est désactivée.|Aller|Applications|Saisir une adresse'),
es:tr('Inicio|Explorador|Configuración|Navegador|Subir|Eliminar|Idioma|Windows Defender|Activado|Desactivado|Aún no hay archivos|Analizado, limpio|Tu dispositivo está protegido.|La protección en tiempo real está desactivada.|Ir|Aplicaciones|Escribe una dirección')
};
let S={lang:'en',def:true,apps:[],key:''};
try{Object.assign(S,JSON.parse(localStorage.vos||'{}'))}catch(e){}
const save=()=>{try{localStorage.vos=JSON.stringify(S)}catch(e){}};
const X={
en:{nsearch:'Normal search',aisearch:'AI search',market:'Market',install:'Install',remove:'Remove',askai:'Ask AI…',needkey:'Add your Claude API key in Settings to use AI search.',keynote:'Stored only on this device.'},
tr:{nsearch:'Normal arama',aisearch:'Yapay zekâ araması',market:'Market',install:'Yükle',remove:'Kaldır',askai:'Yapay zekâya sor…',needkey:'Yapay zekâ araması için Ayarlar’dan Claude API anahtarını ekle.',keynote:'Yalnızca bu cihazda saklanır.'},
az:{nsearch:'Normal axtarış',aisearch:'AI axtarış',market:'Market',install:'Yüklə',remove:'Sil',askai:'AI-dan soruş…',needkey:'AI axtarış üçün Ayarlar-dan Claude API açarını əlavə et.',keynote:'Yalnız bu cihazda saxlanır.'}};
const t=k=>(T[S.lang]&&T[S.lang][k])||(X[S.lang]&&X[S.lang][k])||T.en[k]||X.en[k];
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2500)}

/* ---------- storage (IndexedDB) ---------- */
const db=new Promise((res,rej)=>{try{const r=indexedDB.open('vos',1);r.onupgradeneeded=()=>r.result.createObjectStore('f',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
const tx=async(m,fn)=>{const d=await db;return new Promise((res,rej)=>{const r=fn(d.transaction('f',m).objectStore('f'));r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})};
const fmt=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';

/* ---------- apps ---------- */
async function filesR(b){
  b.innerHTML=`<div style="margin-bottom:10px"><button class="btn" id="up">⬆ ${t('upload')}</button><input type="file" id="fi" multiple hidden></div><div id="fl"></div>`;
  const fi=$('#fi',b);$('#up',b).onclick=()=>fi.click();
  fi.onchange=async()=>{for(const f of fi.files){try{await tx('readwrite',s=>s.add({name:f.name,size:f.size,type:f.type,blob:f}));if(S.def)toast('🛡 '+f.name+': '+t('scanned'))}catch(e){toast('Error: '+f.name)}}fi.value='';filesR(b)};
  let list=[];try{list=await tx('readonly',s=>s.getAll())}catch(e){}
  $('#fl',b).innerHTML=list.length?list.map(f=>`<div class="row" data-id="${f.id}"><span>${f.type.startsWith('image')?'🖼':'📄'} ${esc(f.name)}</span><small>${fmt(f.size)}</small><button class="btn" data-d="${f.id}">🗑 ${t('del')}</button></div>`).join(''):`<p class="mut">${t('empty')}</p>`;
  b.querySelectorAll('[data-d]').forEach(x=>x.onclick=async e=>{e.stopPropagation();await tx('readwrite',s=>s.delete(+x.dataset.d));filesR(b)});
  b.querySelectorAll('.row').forEach(r=>r.onclick=()=>{const f=list.find(i=>i.id==r.dataset.id);const u=URL.createObjectURL(f.blob);const a=document.createElement('a');a.href=u;a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)});
}
function setR(b){
  const lg=Object.entries(LANGS).map(([k,v])=>`<option value="${k}"${k==S.lang?' selected':''}>${v}</option>`).join('');
  b.innerHTML=`<div class="card"><h3>${t('language')}</h3><select class="in" id="lg">${lg}</select></div><div class="card" style="display:flex;align-items:center;gap:12px"><svg viewBox="0 0 24 24" width="30" height="30"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z" fill="${S.def?'#2ecc71':'#f5a623'}"/></svg><div style="flex:1"><h3 style="margin:0">${t('defender')}</h3><p class="mut" style="margin:2px 0 0">${S.def?t('protected'):t('unprotected')}</p></div><label class="sw" style="margin:0"><input type="checkbox" id="df"${S.def?' checked':''}><span></span></label></div><div class="card"><h3>Claude API</h3><input class="in" id="ak" type="password" placeholder="sk-ant-..." value="${esc(S.key||'')}"><p class="mut">${t('keynote')}</p></div>`;
  $('#lg',b).onchange=e=>{S.lang=e.target.value;save();applyLang()};
  $('#df',b).onchange=e=>{S.def=e.target.checked;save();setR(b);tray()};
  $('#ak',b).onchange=e=>{S.key=e.target.value.trim();save()};
}
const IC={
browser:'<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="#1a73e8"/><g fill="none" stroke="#fff" stroke-width="1.6" opacity=".92"><ellipse cx="16" cy="16" rx="6" ry="14"/><path d="M2 16h28M5 9h22M5 23h22"/></g></svg>',
files:'<svg viewBox="0 0 32 32"><path d="M2 8a3 3 0 0 1 3-3h7l3 3h12a3 3 0 0 1 3 3v2H2z" fill="#e8a317"/><path d="M2 12h28v13a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3z" fill="#ffca28"/></svg>',
settings:'<svg viewBox="0 0 32 32"><g stroke="#8a94a6" stroke-width="5" stroke-linecap="round"><path d="M16 3v4M16 25v4M3 16h4M25 16h4M7 7l3 3M22 22l3 3M25 7l-3 3M10 22l-3 3"/></g><circle cx="16" cy="16" r="9" fill="#8a94a6"/><circle cx="16" cy="16" r="4" fill="#3b4252"/></svg>'};
const LOGO='<svg viewBox="0 0 32 32" fill="#0a84ff"><rect x="3" y="3" width="12.5" height="12.5" rx="1.5"/><rect x="16.5" y="3" width="12.5" height="12.5" rx="1.5"/><rect x="3" y="16.5" width="12.5" height="12.5" rx="1.5"/><rect x="16.5" y="16.5" width="12.5" height="12.5" rx="1.5"/></svg>';
let bUrl='',bTab='n',bSug=false,bPend=null,aiH=[],aiBusy=false,aiErr='';
const nbS={};
IC.market='<svg viewBox="0 0 32 32"><path d="M6 10h20l-2 17H8z" fill="#0f9d58"/><path d="M11 10a5 5 0 0 1 10 0" fill="none" stroke="#0b7a43" stroke-width="2.5"/></svg>';
const CAT={
yt:{name:'YouTube',url:'https://m.youtube.com',icon:'<svg viewBox="0 0 32 32"><rect x="2" y="6" width="28" height="20" rx="6" fill="#f00"/><path d="M13 11l8 5-8 5z" fill="#fff"/></svg>'},
tt:{name:'TikTok',url:'https://www.tiktok.com',icon:'<svg viewBox="0 0 32 32"><rect x="2" y="2" width="28" height="28" rx="7" fill="#111"/><path d="M17 8v11a3 3 0 1 1-3-3M17 8c0 3 2 5 5 5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>'},
ig:{name:'Instagram',url:'https://www.instagram.com',icon:'<svg viewBox="0 0 32 32"><rect x="2" y="2" width="28" height="28" rx="8" fill="#d6249f"/><rect x="8" y="8" width="16" height="16" rx="5" fill="none" stroke="#fff" stroke-width="2.2"/><circle cx="16" cy="16" r="3.8" fill="none" stroke="#fff" stroke-width="2.2"/><circle cx="21" cy="11" r="1.2" fill="#fff"/></svg>'}};
const SITES=['youtube.com','google.com','facebook.com','instagram.com','tiktok.com','twitter.com','x.com','wikipedia.org','amazon.com','netflix.com','reddit.com','whatsapp.com','github.com','linkedin.com','twitch.tv','spotify.com','yahoo.com','bing.com','pinterest.com','telegram.org','ebay.com','aliexpress.com','trendyol.com','hepsiburada.com','sahibinden.com','tap.az','turbo.az','lent.az','apa.az','news.az','milliyet.com.tr','hurriyet.com.tr'];
const SEARCH='https://www.google.com/search?q=';
const NB=()=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.NativeBrowser;
const nm=a=>a.name||t(a.key);
const lk=x=>x.split(/(https?:\/\/[^\s<>")\]]*[^\s<>")\].,;:!])/).map((p,i)=>i%2?`<a class="lk" data-u="${esc(p)}">${esc(p)}</a>`:esc(p)).join('');
function NBclose(id){const P=NB();if(P&&nbS[id]){P.close({id});delete nbS[id]}}
const tabsH=()=>`<div style="display:flex;gap:6px"><button class="btn tab${bTab=='n'?' act':''}" data-t="n">${t('nsearch')}</button><button class="btn tab${bTab=='a'?' act':''}" data-t="a">✦ ${t('aisearch')}</button></div>`;
const wireTabs=b=>b.querySelectorAll('[data-t]').forEach(x=>x.onclick=()=>{bTab=x.dataset.t;brR(b)});
function nav(b,u){bUrl=u;$('#ad',b).value=u;const P=NB();
  if(P){const r=$('.vp',b).getBoundingClientRect();nbS.browser={v:true,k:''};P.open({id:'browser',url:u,x:r.x,y:r.y,w:r.width,h:r.height})}else $('iframe',b).src=u}
function openSite(u){bTab='n';bPend=u;open('browser');brR(wins.browser.bd)}
function brR(b){
  b.style.cssText='display:flex;flex-direction:column;gap:8px';bSug=false;
  if(bTab=='a')return aiR(b);
  b.innerHTML=`${tabsH()}<div style="display:flex;gap:6px"><button class="btn" id="bk">◀</button><button class="btn" id="rl">⟳</button><input class="in" id="ad" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://" value="${esc(bUrl)}"><button class="btn" id="go">${t('go')}</button></div><div id="sg2" class="card" style="display:none;margin:0;padding:6px"></div><div class="vp" style="flex:1;display:flex;flex-direction:column;min-height:0;border-radius:8px;overflow:hidden"><iframe></iframe></div>`;
  wireTabs(b);const P=NB(),ad=$('#ad',b),box=$('#sg2',b);
  const hide=()=>{box.style.display='none';bSug=false};
  const go=()=>{const v=ad.value.trim();if(!v)return;let u;if(/^https?:\/\//i.test(v))u=v;else if(/^\S+\.[a-z]{2,}(\/.*)?$/i.test(v))u='https://'+v;else u=SEARCH+encodeURIComponent(v);hide();nav(b,u)};
  ad.oninput=()=>{const q=ad.value.trim().toLowerCase();if(!q||/^https?:\/\//.test(q)||q.includes('.')){hide();return}
    const m=q.includes(' ')?[]:SITES.filter(d=>d.startsWith(q)||d.split('.')[0].startsWith(q)).slice(0,5);
    box.innerHTML=m.map(d=>`<div class="row" data-u="https://${d}"><span>🌐 ${d}</span></div>`).join('')+`<div class="row" data-u="${esc(SEARCH+encodeURIComponent(q))}"><span>🔍 ${esc(q)}</span></div>`;
    box.style.display='block';bSug=true;
    box.querySelectorAll('.row').forEach(r=>r.onclick=()=>{hide();nav(b,r.dataset.u)})};
  $('#go',b).onclick=go;ad.onkeydown=e=>{if(e.key=='Enter')go()};
  $('#bk',b).onclick=()=>P&&P.back({id:'browser'});$('#rl',b).onclick=()=>P&&P.reload({id:'browser'});
  if(bPend){const u=bPend;bPend=null;nav(b,u)}else if(bUrl&&!P)$('iframe',b).src=bUrl;
}
async function askAI(q,b){
  if(aiBusy)return;aiH.push({role:'user',content:q});aiBusy=true;aiErr='';aiR(b);
  const call=async tools=>{const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,system:'You are the search assistant inside the VOS browser. Answer briefly in the same language as the user. When useful, list the most relevant well-known websites as full https:// URLs, one per line, each with a short note.',messages:aiH,...(tools?{tools:[{type:'web_search_20250305',name:'web_search',max_uses:3}]}:{})})});
    const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||r.status);return(j.content||[]).filter(c=>c.type=='text').map(c=>c.text).join('')};
  try{let a;try{a=await call(true)}catch(e){a=await call(false)}aiH.push({role:'assistant',content:a||'…'})}catch(e){aiH.pop();aiErr=String(e.message)}
  aiBusy=false;if(wins.browser&&bTab=='a')aiR(wins.browser.bd);
}
function aiR(b){
  b.innerHTML=`${tabsH()}<div id="aim" style="flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:0">${S.key?'':`<div class="card">${t('needkey')}<br><button class="btn" id="gk" style="margin-top:8px">${t('settings')}</button></div>`}${aiH.map(m=>`<div class="msg ${m.role}">${m.role=='user'?esc(m.content):lk(m.content)}</div>`).join('')}${aiBusy?'<div class="msg assistant">…</div>':''}${aiErr?`<div class="msg assistant" style="color:#e5484d">${esc(aiErr)}</div>`:''}</div><div style="display:flex;gap:6px"><input class="in" id="aq" placeholder="${t('askai')}"><button class="btn" id="as">➤</button></div>`;
  wireTabs(b);const m=$('#aim',b);m.scrollTop=1e9;
  b.querySelectorAll('.lk').forEach(a=>a.onclick=()=>openSite(a.dataset.u));
  const gk=$('#gk',b);if(gk)gk.onclick=()=>open('settings');
  const send=()=>{const q=$('#aq',b).value.trim();if(q&&S.key)askAI(q,b);else if(!S.key)toast(t('needkey'))};
  $('#as',b).onclick=send;$('#aq',b).onkeydown=e=>{if(e.key=='Enter')send()};
}
function siteR(b,url,id){b.style.cssText='padding:0;display:flex;flex-direction:column';b.innerHTML='<div class="vp" style="flex:1;display:flex;flex-direction:column;min-height:0"><iframe></iframe></div>';
  const P=NB(),v=$('.vp',b);if(P){const r=v.getBoundingClientRect();nbS[id]={v:true,k:''};P.open({id,url,x:r.x,y:r.y,w:r.width,h:r.height})}else $('iframe',b).src=url}
function mkR(b){b.style.cssText='';
  b.innerHTML=Object.entries(CAT).map(([id,c])=>`<div class="row card" style="padding:12px"><i style="display:block;width:40px;height:40px;flex:none">${c.icon}</i><span><b>${c.name}</b></span><button class="btn" data-m="${id}">${S.apps.includes(id)?t('remove'):t('install')}</button></div>`).join('');
  b.querySelectorAll('[data-m]').forEach(x=>x.onclick=()=>{const id=x.dataset.m;x.disabled=true;x.textContent='…';
    setTimeout(()=>{S.apps=S.apps.includes(id)?S.apps.filter(i=>i!=id):[...S.apps,id];save();syncApps();applyLang()},1200)})}
function syncApps(){for(const id in CAT){const c=CAT[id];
  if(S.apps.includes(id)){if(!APPS[id])APPS[id]={icon:c.icon,name:c.name,render:b=>siteR(b,c.url,id),live:false}}
  else if(APPS[id]){if(wins[id]){wins[id].el.remove();delete wins[id]}NBclose(id);delete APPS[id]}}}
const topWin=()=>Object.values(wins).filter(w=>w.el.style.display!='none').sort((a,b)=>b.f-a.f)[0];
function nbSync(){const P=NB();if(!P)return;const top=topWin(),sm=$('#sm').style.display=='block';
  for(const id in nbS){const w=wins[id],v=w&&w.bd.querySelector('.vp'),o=nbS[id];
    const vis=w&&v&&w===top&&!sm&&!(id=='browser'&&(bTab!='n'||bSug));
    if(vis){const r=v.getBoundingClientRect(),k=[r.x,r.y,r.width,r.height].join();if(k!==o.k){o.k=k;P.move({id,x:r.x,y:r.y,w:r.width,h:r.height})}if(!o.v){P.show({id});o.v=true}}
    else if(o.v){P.hide({id});o.v=false}}}
setInterval(nbSync,60);
const APPS={
  browser:{icon:IC.browser,key:'browser',render:brR,live:false},
  files:{icon:IC.files,key:'files',render:filesR,live:true},
  market:{icon:IC.market,key:'market',render:mkR,live:true},settings:{icon:IC.settings,key:'settings',render:setR,live:true}
};

/* ---------- window manager ---------- */
let z=10;const wins={};
function open(id){
  $('#sm').style.display='none';
  if(wins[id]){wins[id].el.style.display='flex';focus(id);return}
  const a=APPS[id],el=document.createElement('div');el.className='win';
  const n=Object.keys(wins).length,small=innerWidth<700;
  if(small)el.classList.add('max');else el.style.cssText=`left:${70+n*32}px;top:${30+n*32}px;width:min(680px,80vw);height:min(440px,70vh)`;
  el.innerHTML='<div class="tb"><b></b><button data-a="min">–</button><button data-a="max">▢</button><button data-a="x" class="x">✕</button></div><div class="bd"></div>';
  $('#desk').appendChild(el);
  const w=wins[id]={id,el,ti:$('b',el),bd:$('.bd',el)};
  w.ti.innerHTML=a.icon+nm(a);a.render(w.bd,w.id);
  const tb=$('.tb',el);
  tb.onpointerdown=e=>{focus(id);if(e.target.tagName=='BUTTON'||el.classList.contains('max'))return;
    const r=el.getBoundingClientRect(),p=$('#desk').getBoundingClientRect(),dx=e.clientX-r.left,dy=e.clientY-r.top;tb.setPointerCapture(e.pointerId);
    tb.onpointermove=v=>{el.style.left=Math.max(0,v.clientX-dx-p.left)+'px';el.style.top=Math.max(0,v.clientY-dy-p.top)+'px'};tb.onpointerup=()=>tb.onpointermove=null};
  el.onpointerdown=()=>focus(id);
  tb.onclick=e=>{const k=e.target.dataset.a;if(k=='x'){el.remove();delete wins[id];NBclose(id);task()}else if(k=='min'){el.style.display='none';task()}else if(k=='max')el.classList.toggle('max')};
  focus(id);
}
function focus(id){wins[id].el.style.zIndex=++z;wins[id].f=z;task()}
function task(){const top=Object.values(wins).filter(w=>w.el.style.display!='none').sort((a,b)=>b.f-a.f)[0];
  $('#mid').innerHTML=`<button class="tbtn" id="st">${LOGO}</button>`+Object.keys(APPS).map(id=>`<button class="tbtn${wins[id]?' on':''}" data-id="${id}">${APPS[id].icon}</button>`).join('');
  $('#st').onclick=e=>{e.stopPropagation();const m=$('#sm');m.style.display=m.style.display=='block'?'none':'block'};
  document.querySelectorAll('#mid [data-id]').forEach(b=>b.onclick=()=>{const w=wins[b.dataset.id];if(w&&w===top){w.el.style.display='none';task()}else open(b.dataset.id)})}
function tray(){$('#sd').innerHTML=`<svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z" fill="${S.def?'#2ecc71':'#f5a623'}"/></svg>`}
function clock(){$('#ck').innerHTML=new Date().toLocaleTimeString(S.lang,{hour:'2-digit',minute:'2-digit'})+'<br>'+new Date().toLocaleDateString(S.lang)}
function applyLang(){
  document.documentElement.lang=S.lang;document.documentElement.dir=['ar','fa','he'].includes(S.lang)?'rtl':'ltr';
  Object.values(wins).forEach(w=>{const a=APPS[w.id];w.ti.innerHTML=a.icon+nm(a);if(a.live)a.render(w.bd,w.id)});
  $('#sh').textContent=t('apps');
  $('#sg').innerHTML=Object.keys(APPS).map(id=>`<button data-id="${id}"><i>${APPS[id].icon}</i>${nm(APPS[id])}</button>`).join('');
  $('#sg').querySelectorAll('button').forEach(b=>b.onclick=()=>open(b.dataset.id));
  $('#ic').innerHTML=Object.keys(APPS).map(id=>`<div class="di" data-id="${id}"><i>${APPS[id].icon}</i>${nm(APPS[id])}</div>`).join('');
  $('#ic').querySelectorAll('.di').forEach(d=>d.onclick=()=>open(d.dataset.id));
  clock();task();tray();
}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#sm,#st'))$('#sm').style.display='none'});
syncApps();applyLang();setInterval(clock,10000);
</script></body></html>
