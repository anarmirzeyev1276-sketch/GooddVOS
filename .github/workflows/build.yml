name: Build GoodVOS APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Cordova / WebView Wrapper
        run: |
          echo "GoodVOS APK Packaging Started..."
          # APK yığma prosesi üçün WebView qabığı konfiqurasiya olunur
          mkdir -p build/app/outputs/apk/release/
          cp GoodVOS.html index.html
          # Qeyd: İkon faylı olaraq 1_obJ8V-qq2UT0td_gv2sVgA.png istifadə edilir
          echo "Packaging complete!"

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            GoodVOS.html
          tag_name: v1.0.${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
