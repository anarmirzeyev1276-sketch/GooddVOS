name: Release GoodVOS APK

on:
  push:
    tags:
      - 'v*' # Yalnız v ilə başlayan tag (məsələn: v5) atdıqda işə düşəcək

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: |
          npm install -g cordova

      - name: Build Project & APK
        run: |
          echo "Building APK..."
          # Test üçün fayl (öz build əmrlərin burda ola bilər)
          touch GoodVOS-release.apk

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
