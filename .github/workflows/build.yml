name: Build GoodVOS APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 🔑 Xətanı düzəldən hissə (Releases-ə yazı yaza bilməsi üçün icazə)
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Cordova / Capacitor (və ya digər builder aləti)
        run: |
          npm install -g cordova

      - name: Build Project & APK
        run: |
          # Proqramınızı build edən əmrlər bura gəlir
          echo "Building APK..."

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            # Yaradılan APK faylının yolu (məsələn: platforms/android/app/build/outputs/apk/debug/app-debug.apk)
            *.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
          
